name: Build Texture Packs

on:
  push:
    paths:
      - 'resource_packs/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/build-packs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore builder cache
        uses: actions/cache@v4
        with:
          path: cache/vanilla-asset-catalogs
          key: vanilla-asset-catalogs-${{ hashFiles('config/minecraft-release-version-matrix.psd1') }}
          restore-keys: |
            vanilla-asset-catalogs-

      - name: Build packs
        shell: pwsh
        run: .\scripts\build-texture-packs.ps1

      - name: Upload zip packs
        uses: actions/upload-artifact@v4
        with:
          name: zipped-packs
          path: build
          if-no-files-found: error
